version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: schrodinger-postgres
    environment:
      POSTGRES_DB: schrodinger
      POSTGRES_USER: schrodinger
      POSTGRES_PASSWORD: schrodinger_dev_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U schrodinger -d schrodinger']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: schrodinger-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
